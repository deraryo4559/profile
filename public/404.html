<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Redirecting...</title>
  </head>
  <body>
    <script>
      ;(function () {
        var githubBase = '/profile'
        var isGitHubPages = window.location.hostname.indexOf('github.io') !== -1
        var base = isGitHubPages ? githubBase : ''
        var path = window.location.pathname
        var hasBasePath = base && (path === base || path.indexOf(base + '/') === 0)
        var route = hasBasePath ? path.slice(base.length) || '/' : path || '/'
        var query = route === '/' ? '' : '?route=' + encodeURIComponent(route)

        window.location.replace(base + '/' + query)
      })()
    </script>
  </body>
</html>
